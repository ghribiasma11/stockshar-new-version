# Free-tier blueprint: two Render web resources plus a free external PostgreSQL.
#  - stockshare-api : free Docker web service (sleeps after 15 minutes idle, 750 instance hours/month)
#  - stockshare-web : free static site (always on, no sleep)
#  - database       : brought from Neon or Supabase (both have a permanently free PostgreSQL plan)
#
# Before applying: create a free PostgreSQL database and copy its connection string.
services:
  - type: web
    name: stockshare-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /api/health
    envVars:
      # Render asks for this value during blueprint creation. Paste the PostgreSQL
      # connection string from Neon or Supabase, including sslmode=require.
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      # Replace with the URL Render gives the static site after the first deploy.
      - key: CORS_ORIGIN
        value: https://stockshare-web.onrender.com

  - type: web
    name: stockshare-web
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    envVars:
      # Replace with the URL Render gives the API after the first deploy.
      - key: VITE_API_BASE
        value: https://stockshare-api.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
